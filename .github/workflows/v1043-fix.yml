name: Tamburi-v10-43-kataster-address
on:
  push:
    paths:
      - .github/workflows/v1043-fix.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch
        run: python3 -c "import base64;exec(base64.b64decode(''))"
      - name: Commit
        run: git config user.name github-actions-bot && git config user.email github-actions-bot@users.noreply.github.com && git add index.html && git commit -m 'v10.43 kataster from address and postal code' && git push
