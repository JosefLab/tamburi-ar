<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tamburi Desktop Light v1.0</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#eef0f1}#app{position:fixed;inset:0;width:100%;height:100%;border:0}
</style>
</head>
<body>
<iframe id="app" src="v1043.html?desktoplight=1" title="Tamburi Desktop Light v1.0"></iframe>
<script>
const f=document.getElementById('app');
function setup(){
 const d=f.contentDocument,w=f.contentWindow;if(!d)return;
 d.title='Tamburi Desktop Light v1.0';
 const s=d.createElement('style');s.textContent=`
 header,#preLocationPanel,#v10ModePanel,#v1090NewSiteWrap,#photoControls,#v9Result,#v1044SheetPanel,
 #cameraActions,#photoModeBtn,#stopPhotoBtn,#locationStatus,#desktopLocationBtn{display:none!important}
 body{padding-bottom:28px}
 #stage{height:min(62vh,720px)!important;min-height:500px}
 #desktopTools{display:block!important}
 #desktopTools>.label{font-size:17px;margin-bottom:12px}
 #desktopTools .row{gap:10px}
 #desktopTools .choice,#desktopTools .action{font-size:15px;padding:11px 16px}
 #desktopTools .sliderrow{font-size:14px}
 #desktopPhotoName{font-size:15px!important;padding:12px!important}
 #desktopSave{width:100%;margin-top:12px!important;padding:14px!important;font-size:17px!important}
 `;d.head.appendChild(s);
 // Force the existing, proven desktop workflow.
 const desktop=d.querySelector('[data-mode="desktop"]'); if(desktop) desktop.click();
 // Remove location/address from desktop tools.
 ['desktopLocationBtn','locationStatus'].forEach(id=>d.getElementById(id)?.remove());
 // Keep only file name below the photo; move Save below it.
 const tools=d.getElementById('desktopTools');
 if(tools){
   const name=d.getElementById('desktopPhotoName');
   const save=d.getElementById('desktopSave')||[...tools.querySelectorAll('button')].find(b=>/Bild speichern/i.test(b.textContent));
   if(name&&save){
     const wrap=d.createElement('div');wrap.id='desktopLightBottom';
     name.parentElement?.insertBefore(wrap,name);wrap.appendChild(name);wrap.appendChild(save);
   }
 }
 // Hide any pre-location/address panels that older base code may reinsert.
 new MutationObserver(()=>{d.getElementById('preLocationPanel')?.style.setProperty('display','none','important')}).observe(d.body,{childList:true,subtree:true});
 // Load current stable procedural model without changing the main app.
 if(!d.getElementById('v1086Models')){const m=d.createElement('script');m.id='v1086Models';m.type='module';m.src='v1086-models.js?v=1093';d.head.appendChild(m)}
}
f.addEventListener('load',()=>setTimeout(setup,150));setTimeout(setup,1000);
</script>
</body></html>
