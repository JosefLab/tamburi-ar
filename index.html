function injectV1046(){const frame=document.getElementById('app'),w=frame.contentWindow,d=frame.contentDocument;if(!w||!d)return;d.title='Tamburi Standort AR v10.46';const vs=d.querySelector('header h1 span');if(vs)vs.textContent='v10.46';const style=d.createElement('style');style.textContent=`#v1044SheetPanel{margin:10px;border:0;border-radius:15px;padding:14px;background:#fff;box-shadow:0 3px 14px rgba(24,28,32,.07)}#v1044SheetPanel .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}#v1044SheetPanel .field{display:flex;flex-direction:column;gap:5px}#v1044SheetPanel .full{grid-column:1/-1}#v1044SheetPanel label{font-size:12px;font-weight:700;color:#3a3d41}#v1044SheetPanel input,#v1044SheetPanel select,#v1044SheetPanel textarea{width:100%;padding:10px;border:1px solid #bbb;border-radius:9px;font:inherit;background:#fff}#v1044SheetPanel textarea{min-height:78px;resize:vertical}#v1044Send{background:linear-gradient(135deg,#f28c28,#d96f0d);color:#fff;border:0;border-radius:11px;padding:12px 18px;font-weight:700;font-size:15px}#v1044Send:disabled{opacity:.55}#v1044SheetStatus{font-size:12px;color:#5b6065;min-height:18px;margin-top:7px}@media(max-width:650px){#v1044SheetPanel .grid{grid-template-columns:1fr}}`;d.head.appendChild(style);
const p=d.createElement('div');p.id='v1044SheetPanel';p.innerHTML=`<div class="label">📋 Standortdaten · Google Sheet</div><div class="small" style="margin-bottom:10px">Nur der bevorzugte Standort wird mit „Senden“ als eine neue Zeile übertragen.</div><div class="grid"><div class="field full"><label>Adresse</label><input id="v1044Adresse"></div><div class="field"><label>GPS Latitude</label><input id="v1044Lat" inputmode="decimal"></div><div class="field"><label>GPS Longitude</label><input id="v1044Lon" inputmode="decimal"></div><div class="field full"><label>Montagebeschreibung</label><textarea id="v1044Montage"></textarea></div><div class="field"><label>Grundmodul</label><select id="v1044Grundmodul"><option value="1">1</option><option value="0">0 / ohne Kasten</option></select></div><div class="field"><label>Erweiterungskästen</label><select id="v1044Erweiterung"><option value="0">0</option><option value="1">1</option><option value="2">2</option></select></div><div class="field"><label>Montagefläche</label><input id="v1044Flaeche"></div><div class="field"><label>Besichtigt am</label><input id="v1044Datum" type="date"></div><div class="field"><label>Besichtigt von</label><input id="v1044Besichtiger" value="Josef Röhrich"></div><div class="field"><label>Montagemittel</label><input id="v1044Mittel"></div><div class="field"><label>Betonplatten</label><select id="v1044Platten"><option>Nein</option><option>50 cm</option><option>100 cm</option><option>Ja</option></select></div><div class="field"><label>Beschilderung</label><select id="v1044Schild"><option>Nein</option><option>Ja</option></select></div><div class="field"><label>Solar</label><select id="v1044Solar"><option>Nein</option><option>Ja</option></select></div><div class="field"><label>Bevorzugte Variante</label><select id="v1044Preferred"><option value="1">Variante 1</option></select></div><div class="field"><label>Rendering</label><input id="v1044Rendering"></div><div class="field full"><label>Genossenschaft / Hausverwaltung</label><input id="v1044HV"></div><div class="field"><label>Ansprechpartner</label><input id="v1044Kontakt"></div><div class="field"><label>Telefon</label><input id="v1044Tel" type="tel"></div><div class="field full"><label>E-Mail</label><input id="v1044Email" type="email"></div></div><div style="margin-top:12px"><button id="v1044Send" type="button">📤 An Google Sheet senden</button></div><div id="v1044SheetStatus"></div>`;const result=d.getElementById('v9Result');if(result)result.insertAdjacentElement('afterend',p);else d.body.appendChild(p);const $=id=>d.getElementById(id);const now=new Date();$('v1044Datum').value=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
function syncGPSFromDisplay(){const txt=d.getElementById('preLocationGps')?.textContent||'';const m=txt.match(/GPS:\s*(-?\d+(?:\.\d+)?)\s*,\s*(-?\d+(?:\.\d+)?)/i);if(m){$('v1044Lat').value=m[1];$('v1044Lon').value=m[2];return true}return false}
function syncAddress(){const a=(d.getElementById('preLocationAddress')?.value||d.getElementById('photoName')?.value||'').trim();if(a&&d.activeElement!==$('v1044Adresse'))$('v1044Adresse').value=a}
function sync(){syncAddress();syncGPSFromDisplay()}
p.addEventListener('focusin',sync);setInterval(sync,750);const locate=d.getElementById('preLocationBtn');if(locate)locate.addEventListener('click',()=>{let n=0;const t=setInterval(()=>{sync();if(syncGPSFromDisplay()||++n>150)clearInterval(t)},100)});
$('v1044Send').onclick=async()=>{sync();const st=$('v1044SheetStatus'),btn=$('v1044Send');if(!$('v1044Adresse').value.trim()){st.textContent='Bitte zuerst eine Adresse eintragen.';return}if(!$('v1044HV').value.trim()){st.textContent='Bitte Genossenschaft / Hausverwaltung eintragen.';return}const data={adresse:$('v1044Adresse').value.trim(),latitude:$('v1044Lat').value.trim(),longitude:$('v1044Lon').value.trim(),montagebeschreibung:$('v1044Montage').value.trim(),grundmodul:$('v1044Grundmodul').value,erweiterungskaesten:$('v1044Erweiterung').value,montageflaeche:$('v1044Flaeche').value.trim(),besichtigtAm:$('v1044Datum').value,besichtigtVon:$('v1044Besichtiger').value.trim(),montagemittel:$('v1044Mittel').value.trim(),betonplatten:$('v1044Platten').value,beschilderung:$('v1044Schild').value,solar:$('v1044Solar').value,rendering:$('v1044Rendering').value.trim(),hausverwaltung:$('v1044HV').value.trim(),ansprechpartner:$('v1044Kontakt').value.trim(),telefon:$('v1044Tel').value.trim(),email:$('v1044Email').value.trim()};btn.disabled=true;st.textContent='Standort wird gesendet …';try{await fetch(SHEET_WEBAPP,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=UTF-8'},body:JSON.stringify(data)});st.textContent='Gesendet: '+data.adresse+' · Bitte im Sheet kontrollieren.'}catch(e){st.textContent='Senden fehlgeschlagen.'}finally{btn.disabled=false}};sync()}

</script></body></html>
