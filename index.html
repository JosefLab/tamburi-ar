<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffffff"><title>Tamburi Standort AR v10.50</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#eef0f1}#app{position:fixed;inset:0;width:100%;height:100%;border:0;background:#eef0f1}</style></head><body><iframe id="app" src="v1043.html" title="Tamburi Standort AR v10.50" allow="camera; geolocation; fullscreen; clipboard-write"></iframe><script>
const SHEET_WEBAPP='https://script.google.com/macros/s/AKfycby9N5ZygYPfmUNHYnCaO0lFTsXJ86G0Xq3BEsf8qJv0LD72ckeMOIobFGGMJk2WMK-24g/exec';
function injectV1050(){const frame=document.getElementById('app'),w=frame.contentWindow,d=frame.contentDocument;if(!w||!d)return;d.title='Tamburi Standort AR v10.50';const vs=d.querySelector('header h1 span');if(vs)vs.textContent='v10.50';const style=d.createElement('style');style.textContent=`#v1044SheetPanel{margin:10px;border:0;border-radius:15px;padding:14px;background:#fff;box-shadow:0 3px 14px rgba(24,28,32,.07)}#v1044SheetPanel .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}#v1044SheetPanel .field{display:flex;flex-direction:column;gap:5px}#v1044SheetPanel .full{grid-column:1/-1}#v1044SheetPanel label{font-size:12px;font-weight:700;color:#3a3d41}#v1044SheetPanel input,#v1044SheetPanel select,#v1044SheetPanel textarea{width:100%;padding:10px;border:1px solid #bbb;border-radius:9px;font:inherit;background:#fff}#v1044SheetPanel textarea{min-height:78px;resize:vertical}#v1044Send{background:linear-gradient(135deg,#f28c28,#d96f0d);color:#fff;border:0;border-radius:11px;padding:12px 18px;font-weight:700;font-size:15px}#v1044Send:disabled{opacity:.55}#v1044SheetStatus{font-size:12px;color:#5b6065;min-height:18px;margin-top:7px}@media(max-width:650px){#v1044SheetPanel .grid{grid-template-columns:1fr}}`;d.head.appendChild(style);
const p=d.createElement('div');p.id='v1044SheetPanel';p.innerHTML=`<div class="label">📋 Standortdaten · Google Sheet</div><div class="small" style="margin-bottom:10px">Die bevorzugte Variante wird mit den Standortdaten übertragen.</div><div class="grid"><div class="field full"><label>Adresse</label><input id="v1044Adresse"></div><div class="field"><label>GPS Latitude</label><input id="v1044Lat" inputmode="decimal" placeholder="48.12345678"></div><div class="field"><label>GPS Longitude</label><input id="v1044Lon" inputmode="decimal" placeholder="16.12345678"></div><div class="field full"><label>Montagebeschreibung</label><textarea id="v1044Montage"></textarea></div><div class="field"><label>Grundmodul</label><select id="v1044Grundmodul"><option value="1">1</option><option value="0">0 / ohne Kasten</option></select></div><div class="field"><label>Erweiterungskästen</label><select id="v1044Erweiterung"><option value="0">0</option><option value="1">1</option><option value="2">2</option></select></div><div class="field"><label>Montagefläche</label><input id="v1044Flaeche"></div><div class="field"><label>Besichtigt am</label><input id="v1044Datum" type="date"></div><div class="field"><label>Besichtigt von</label><input id="v1044Besichtiger" value="Josef Röhrich"></div><div class="field"><label>Montagemittel</label><select id="v1044Mittel"><option value="Betonsockel">Betonsockel</option><option value="Wandmontage">Wandmontage</option><option value="Erdschrauben">Erdschrauben</option><option value="Schlaganker">Schlaganker</option></select></div><div class="field"><label>Betonplatten</label><select id="v1044Platten"><option>Nein</option><option>50 cm</option><option>100 cm</option><option>Ja</option></select></div><div class="field"><label>Beschilderung</label><select id="v1044Schild"><option>Nein</option><option>Ja</option></select></div><div class="field"><label>Solar</label><select id="v1044Solar"><option>Nein</option><option>Ja</option></select></div><div class="field"><label>Bevorzugte Variante</label><select id="v1044Preferred"><option value="1">Variante 1</option></select></div></div><div style="margin-top:12px"><button id="v1044Send" type="button">📤 An Google Sheet senden</button></div><div id="v1044SheetStatus"></div>`;const result=d.getElementById('v9Result');if(result)result.insertAdjacentElement('afterend',p);else d.body.appendChild(p);const $=id=>d.getElementById(id);const now=new Date();$('v1044Datum').value=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
function formatCoord8(v){const n=Number(String(v).replace(',','.'));return Number.isFinite(n)?n.toFixed(8):''}
function syncGPSFromPosition(){try{if(w.lastGeoPosition&&Number.isFinite(Number(w.lastGeoPosition.lat))&&Number.isFinite(Number(w.lastGeoPosition.lon))){$('v1044Lat').value=Number(w.lastGeoPosition.lat).toFixed(8);$('v1044Lon').value=Number(w.lastGeoPosition.lon).toFixed(8);return true}}catch(e){}return false}
function syncGPSFromDisplay(){if(syncGPSFromPosition())return true;const txt=d.getElementById('preLocationGps')?.textContent||'';const m=txt.match(/GPS:\s*(-?\d+(?:\.\d+)?)\s*,\s*(-?\d+(?:\.\d+)?)/i);if(m){$('v1044Lat').value=formatCoord8(m[1]);$('v1044Lon').value=formatCoord8(m[2]);return true}return false}
function syncAddress(){const a=(d.getElementById('preLocationAddress')?.value||d.getElementById('photoName')?.value||'').trim();if(a&&d.activeElement!==$('v1044Adresse'))$('v1044Adresse').value=a}
function syncPreferred(){const badges=[...d.querySelectorAll('#v10VariantBadges .v10Badge')],sel=$('v1044Preferred');if(!sel||!badges.length)return;const old=sel.value;sel.innerHTML=badges.map((_,i)=>`<option value="${i+1}">Variante ${i+1}</option>`).join('');sel.value=badges[Number(old)-1]?old:String(badges.length)}
function sync(){syncAddress();syncGPSFromDisplay();syncPreferred()}
async function preferredPhoto(){const n=Number($('v1044Preferred').value||1),badges=[...d.querySelectorAll('#v10VariantBadges .v10Badge')];if(!badges.length)return null;const current=badges.findIndex(b=>b.classList.contains('active'));const target=badges[n-1];if(!target)return null;target.click();await new Promise(r=>setTimeout(r,50));const img=d.getElementById('v9ResultImg');if(!img?.src)return null;const blob=await fetch(img.src).then(r=>r.blob());if(current>=0&&badges[current])badges[current].click();const dataUrl=await new Promise((resolve,reject)=>{const fr=new FileReader();fr.onload=()=>resolve(fr.result);fr.onerror=reject;fr.readAsDataURL(blob)});const base=($('v1044Adresse').value||'Tamburi Standort').replace(/[\\/:*?"<>|]+/g,'-').trim();return{data:String(dataUrl).split(',')[1],mimeType:blob.type||'image/jpeg',name:`${base} - Variante ${n}.jpg`,variant:n}}
p.addEventListener('focusin',sync);setInterval(sync,750);const locate=d.getElementById('preLocationBtn');if(locate)locate.addEventListener('click',()=>{let n=0;const t=setInterval(()=>{sync();if(syncGPSFromDisplay()||++n>150)clearInterval(t)},100)});
$('v1044Send').onclick=async()=>{sync();const st=$('v1044SheetStatus'),btn=$('v1044Send');if(!$('v1044Adresse').value.trim()){st.textContent='Bitte zuerst eine Adresse eintragen.';return}const lat=formatCoord8($('v1044Lat').value),lon=formatCoord8($('v1044Lon').value);if(!lat||!lon){st.textContent='Bitte gültige GPS-Koordinaten eintragen oder Standort abrufen.';return}$('v1044Lat').value=lat;$('v1044Lon').value=lon;btn.disabled=true;st.textContent='Standort und Foto werden vorbereitet …';try{const photo=await preferredPhoto();const data={adresse:$('v1044Adresse').value.trim(),latitude:"'"+lat,longitude:"'"+lon,montagebeschreibung:$('v1044Montage').value.trim(),grundmodul:$('v1044Grundmodul').value,erweiterungskaesten:$('v1044Erweiterung').value,montageflaeche:$('v1044Flaeche').value.trim(),besichtigtAm:$('v1044Datum').value,besichtigtVon:$('v1044Besichtiger').value.trim(),montagemittel:$('v1044Mittel').value,betonplatten:$('v1044Platten').value,beschilderung:$('v1044Schild').value,solar:$('v1044Solar').value,bevorzugteVariante:$('v1044Preferred').value};if(photo){data.fotoBase64=photo.data;data.fotoMimeType=photo.mimeType;data.fotoDateiname=photo.name}else{st.textContent='Keine gespeicherte Variante gefunden.';return}st.textContent='Standort und Foto werden gesendet …';await fetch(SHEET_WEBAPP,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=UTF-8'},body:JSON.stringify(data)});st.textContent='Gesendet: '+data.adresse+' · Variante '+data.bevorzugteVariante+' wurde für Google Drive mitgesendet.'}catch(e){console.error(e);st.textContent='Senden fehlgeschlagen.'}finally{btn.disabled=false}};sync()}
document.getElementById('app').addEventListener('load',()=>{try{injectV1050()}catch(e){console.error('v10.50 konnte nicht geladen werden',e)}});
</script></body></html>
