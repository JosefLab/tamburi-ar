<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffffff"><title>Tamburi Standort AR v10.54</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#eef0f1}#app{position:fixed;inset:0;width:100%;height:100%;border:0;background:#eef0f1}</style></head><body><iframe id="app" src="v1043.html" title="Tamburi Standort AR v10.54" allow="camera; geolocation; fullscreen; clipboard-write"></iframe><script>
const SHEET_WEBAPP='https://script.google.com/macros/s/AKfycby9N5ZygYPfmUNHYnCaO0lFTsXJ86G0Xq3BEsf8qJv0LD72ckeMOIobFGGMJk2WMK-24g/exec';
const DRAFT_KEY='tamburi-ar-v1054-draft';
function injectV1054(){const frame=document.getElementById('app'),w=frame.contentWindow,d=frame.contentDocument;if(!w||!d)return;d.title='Tamburi Standort AR v10.54';const vs=d.querySelector('header h1 span');if(vs)vs.textContent='v10.54';const style=d.createElement('style');style.textContent=`#v1044SheetPanel{margin:10px;border:0;border-radius:15px;padding:14px;background:#fff;box-shadow:0 3px 14px rgba(24,28,32,.07)}#v1044SheetPanel .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}#v1044SheetPanel .field{display:flex;flex-direction:column;gap:5px}#v1044SheetPanel .full{grid-column:1/-1}#v1044SheetPanel label{font-size:12px;font-weight:700;color:#3a3d41}#v1044SheetPanel input,#v1044SheetPanel select,#v1044SheetPanel textarea{width:100%;padding:10px;border:1px solid #bbb;border-radius:9px;font:inherit;background:#fff}#v1044SheetPanel textarea{min-height:78px;resize:vertical}#v1044Send{background:linear-gradient(135deg,#f28c28,#d96f0d);color:#fff;border:0;border-radius:11px;padding:12px 18px;font-weight:700;font-size:15px}#v1044Send:disabled{opacity:.55}#v1044SheetStatus{font-size:12px;color:#5b6065;min-height:18px;margin-top:7px}#v1054Check{margin:10px 0 0;padding:10px;border-radius:10px;background:#f7f8f8;font-size:12px}.v1054ok{color:#24733b}.v1054warn{color:#9b5a00}@media(max-width:650px){#v1044SheetPanel .grid{grid-template-columns:1fr}}`;d.head.appendChild(style);
const p=d.createElement('div');p.id='v1044SheetPanel';p.innerHTML=`<div class="label">📋 Standortdaten · Google Sheet</div><div class="small" style="margin-bottom:10px">Favorisierte Variante wird zuerst übertragen, Alternativen folgen danach.</div><div class="grid"><div class="field full"><label>Adresse</label><input id="v1044Adresse"></div><div class="field"><label>GPS Latitude</label><input id="v1044Lat" inputmode="decimal"></div><div class="field"><label>GPS Longitude</label><input id="v1044Lon" inputmode="decimal"></div><div class="field full"><label>Montagebeschreibung</label><textarea id="v1044Montage"></textarea></div><div class="field"><label>Grundmodul</label><select id="v1044Grundmodul"><option value="1">1</option><option value="0">0 / ohne Kasten</option></select></div><div class="field"><label>Erweiterungskästen</label><select id="v1044Erweiterung"><option value="0">0</option><option value="1">1</option><option value="2">2</option></select></div><div class="field"><label>Montagefläche</label><input id="v1044Flaeche"></div><div class="field"><label>Besichtigt am</label><input id="v1044Datum" type="date"></div><div class="field"><label>Besichtigt von</label><input id="v1044Besichtiger" value="Josef Röhrich"></div><div class="field"><label>Montagemittel</label><select id="v1044Mittel"><option>Betonsockel</option><option>Wandmontage</option><option>Erdschrauben</option><option>Schlaganker</option></select></div><div class="field"><label>Betonplatten</label><select id="v1044Platten"><option>Nein</option><option>50 cm</option><option>100 cm</option><option>Ja</option></select></div><div class="field"><label>Beschilderung</label><select id="v1044Schild"><option>Nein</option><option>Ja</option></select></div><div class="field"><label>Solar</label><select id="v1044Solar"><option>Nein</option><option>Ja</option></select></div><div class="field"><label>Bevorzugte Variante</label><select id="v1044Preferred"><option value="1">Variante 1</option></select></div></div><div id="v1054Check">Noch keine Variante vorhanden.</div><div style="margin-top:12px"><button id="v1044Send" type="button">📤 Alle Varianten an Google Sheet senden</button></div><div id="v1044SheetStatus"></div>`;const result=d.getElementById('v9Result');if(result)result.insertAdjacentElement('afterend',p);else d.body.appendChild(p);const $=id=>d.getElementById(id);const today=()=>{const n=new Date();return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}-${String(n.getDate()).padStart(2,'0')}`};$('v1044Datum').value=today();
function formatCoord8(v){const n=Number(String(v).replace(',','.'));return Number.isFinite(n)?n.toFixed(8):''}function syncGPS(){const txt=d.getElementById('preLocationGps')?.textContent||'';const m=txt.match(/GPS:\s*(-?\d+(?:\.\d+)?)\s*,\s*(-?\d+(?:\.\d+)?)/i);if(m){$('v1044Lat').value=formatCoord8(m[1]);$('v1044Lon').value=formatCoord8(m[2])}}function syncAddress(){const a=(d.getElementById('preLocationAddress')?.value||d.getElementById('photoName')?.value||'').trim();if(a&&d.activeElement!==$('v1044Adresse'))$('v1044Adresse').value=a}function badges(){return [...d.querySelectorAll('#v10VariantBadges .v10Badge')]}function syncPreferred(){const bs=badges(),s=$('v1044Preferred');if(!bs.length)return;const old=s.value;s.innerHTML=bs.map((_,i)=>`<option value="${i+1}">Variante ${i+1}</option>`).join('');s.value=bs[Number(old)-1]?old:'1'}function updateCheck(){const n=badges().length,c=$('v1054Check');if(!n){c.className='v1054warn';c.textContent='⚠ Noch keine Variante vorhanden.'}else{c.className='v1054ok';c.textContent=`✓ ${n} Rendering${n===1?'':'s'} gespeichert. Vor dem neuen Standort werden alle Varianten berücksichtigt.`}}function sync(){syncAddress();syncGPS();syncPreferred();updateCheck()}
const ids=['v1044Adresse','v1044Lat','v1044Lon','v1044Montage','v1044Grundmodul','v1044Erweiterung','v1044Flaeche','v1044Datum','v1044Besichtiger','v1044Mittel','v1044Platten','v1044Schild','v1044Solar','v1044Preferred','preLocationAddress','photoName'];function saveDraft(){try{const values={};ids.forEach(id=>{const e=d.getElementById(id);if(e)values[id]=e.value});localStorage.setItem(DRAFT_KEY,JSON.stringify({savedAt:Date.now(),values}))}catch(e){}}function restoreDraft(){try{const x=JSON.parse(localStorage.getItem(DRAFT_KEY)||'null');if(x?.values)Object.entries(x.values).forEach(([id,v])=>{const e=d.getElementById(id);if(e)e.value=v})}catch(e){}}function clearDraft(){try{localStorage.removeItem(DRAFT_KEY)}catch(e){}}
async function blobData(blob){return await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(String(r.result).split(',')[1]);r.onerror=reject;r.readAsDataURL(blob)})}async function collectVariants(){const bs=badges();if(!bs.length)throw new Error('Keine gespeicherte Variante gefunden.');const active=bs.findIndex(b=>b.classList.contains('active')),out=[];for(let i=0;i<bs.length;i++){bs[i].click();await new Promise(r=>setTimeout(r,60));const src=d.getElementById('v9ResultImg')?.src;if(!src)throw new Error(`Rendering Variante ${i+1} fehlt.`);const blob=await (await fetch(src)).blob();out.push({originalVariant:i+1,renderingBase64:await blobData(blob),renderingMimeType:blob.type||'image/jpeg'})}if(active>=0&&bs[active])bs[active].click();const fav=Number($('v1044Preferred').value||1);return out.sort((a,b)=>(a.originalVariant===fav?-1:b.originalVariant===fav?1:a.originalVariant-b.originalVariant)).map((x,i)=>({...x,position:i+1,favorit:i===0}))}function nativePost(data){let t=d.getElementById('v1052PostTarget');if(!t){t=d.createElement('iframe');t.id='v1052PostTarget';t.name='v1052PostTarget';t.style.display='none';d.body.appendChild(t)}const f=d.createElement('form');f.method='POST';f.action=SHEET_WEBAPP;f.target='v1052PostTarget';f.style.display='none';const i=d.createElement('input');i.type='hidden';i.name='payload';i.value=JSON.stringify(data);f.appendChild(i);d.body.appendChild(f);f.submit();setTimeout(()=>f.remove(),1500)}
restoreDraft();d.addEventListener('input',saveDraft,true);d.addEventListener('change',saveDraft,true);setInterval(()=>{sync();saveDraft()},1000);const newSite=d.getElementById('v10NewSite');if(newSite)newSite.addEventListener('click',()=>{clearDraft();['v1044Adresse','v1044Lat','v1044Lon','v1044Montage','v1044Flaeche'].forEach(id=>{const e=$(id);if(e)e.value=''});$('v1044Grundmodul').value='1';$('v1044Erweiterung').value='0';$('v1044Mittel').value='Betonsockel';$('v1044Platten').value='Nein';$('v1044Schild').value='Nein';$('v1044Solar').value='Nein';$('v1044Datum').value=today();$('v1044Besichtiger').value='Josef Röhrich';setTimeout(()=>{clearDraft();saveDraft();sync()},300)});
$('v1044Send').onclick=async()=>{sync();const st=$('v1044SheetStatus'),btn=$('v1044Send');if(!$('v1044Adresse').value.trim()){st.textContent='Bitte zuerst eine Adresse eintragen.';return}const lat=formatCoord8($('v1044Lat').value),lon=formatCoord8($('v1044Lon').value);if(!lat||!lon){st.textContent='Bitte gültige GPS-Koordinaten eintragen.';return}btn.disabled=true;try{st.textContent='Varianten werden vorbereitet …';const variants=await collectVariants(),base=$('v1044Adresse').value.trim();variants.forEach(v=>v.renderingName=`${base} - ${v.favorit?'Favorit':'Alternative '+v.position} - Rendering`);const data={adresse:base,latitude:"'"+lat,longitude:"'"+lon,montagebeschreibung:$('v1044Montage').value.trim(),grundmodul:$('v1044Grundmodul').value,erweiterungskaesten:$('v1044Erweiterung').value,montageflaeche:$('v1044Flaeche').value.trim(),besichtigtAm:$('v1044Datum').value,besichtigtVon:$('v1044Besichtiger').value.trim(),montagemittel:$('v1044Mittel').value,betonplatten:$('v1044Platten').value,beschilderung:$('v1044Schild').value,solar:$('v1044Solar').value,bevorzugteVariante:$('v1044Preferred').value,varianten:variants};nativePost(data);st.textContent=`Übertragung gestartet: ${variants.length} Variante${variants.length===1?'':'n'}, Favorit zuerst.`}catch(e){st.textContent='Senden fehlgeschlagen: '+(e.message||e)}finally{btn.disabled=false}};sync();saveDraft()}
document.getElementById('app').addEventListener('load',()=>{try{injectV1054()}catch(e){console.error('v10.54 konnte nicht geladen werden',e)}});
</script></body></html>
